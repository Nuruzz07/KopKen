<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Galeri Aset Supabase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-stone-900 text-white p-6 min-h-screen">
  <div class="max-w-5xl mx-auto space-y-4">
    <div class="flex items-center justify-between border-b border-stone-700 pb-4">
      <h1 class="text-xl font-bold">Galeri Storage Supabase</h1>
      <div class="flex gap-2">
        <button onclick="loadBucket('assets')" class="px-4 py-1.5 bg-amber-600 hover:bg-amber-700 rounded-lg text-xs font-bold transition">
          Bucket Assets
        </button>
        <button onclick="loadBucket('receipts')" class="px-4 py-1.5 bg-stone-700 hover:bg-stone-600 rounded-lg text-xs font-bold transition">
          Bucket Receipts
        </button>
      </div>
    </div>

    <div id="image-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 pt-2">
      <p class="text-stone-400 text-xs col-span-full">Memuat foto...</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://axaoagzveujcgoxybdmp.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_GQ19XRT7yWIBido0iXJvCQ_ybZ_I7ju";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadBucket(bucketName) {
      const grid = document.getElementById("image-grid");
      grid.innerHTML = `<p class="text-stone-400 text-xs col-span-full">Mengambil data ${bucketName}...</p>`;

      const { data, error } = await client.storage.from(bucketName).list('', {
        limit: 100,
        offset: 0,
        sortBy: { column: 'created_at', order: 'desc' }
      });

      if (error || !data || data.length === 0) {
        grid.innerHTML = `<p class="text-rose-400 text-xs col-span-full">Tidak ada file ditemukan atau akses terkunci.</p>`;
        return;
      }

      grid.innerHTML = data.filter(f => f.name !== '.emptyFolderPlaceholder').map(file => {
        const { data: pub } = client.storage.from(bucketName).getPublicUrl(file.name);
        return `
          <div class="bg-stone-800 rounded-xl p-2 border border-stone-700 flex flex-col justify-between gap-2 shadow-sm">
            <a href="${pub.publicUrl}" target="_blank" class="block aspect-square overflow-hidden rounded-lg bg-stone-950 flex items-center justify-center">
              <img src="${pub.publicUrl}" alt="${file.name}" class="w-full h-full object-cover hover:scale-105 transition duration-200" loading="lazy" />
            </a>
            <div class="space-y-1">
              <p class="text-[11px] font-semibold text-stone-300 truncate" title="${file.name}">${file.name}</p>
              <button onclick="navigator.clipboard.writeText('${pub.publicUrl}'); alert('URL disalin!')" class="w-full py-1 bg-stone-700 hover:bg-stone-600 rounded text-[10px] font-bold text-amber-300 transition">
                Salin Link URL
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    loadBucket('assets');
  </script>
</body>
</html>
