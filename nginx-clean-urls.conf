# ==============================================================================
# BINTANG STORE - PRODUCTION NGINX CONFIGURATION FOR CLEAN URLS
# Architecture: Cyber-Luxury Monolith (Concept 6C)
# Target Server: VPS / Ubuntu / Debian / CentOS Nginx
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name bintanggstore.web.id www.bintanggstore.web.id;

    # Root Directory di Server VPS (Sesuaikan dengan path deploy Anda)
    root /var/www/html/bintangstore;
    index home.html index.html;

    # Charset
    charset utf-8;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression untuk Efisiensi Bandwidth
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. CORE ROUTING & CLEAN URLS (Tanpa Ekstensi .html)
    # Aturan try_files untuk rute /kopken, /tracking, /digital-legacy, dsb.
    # --------------------------------------------------------------------------
    location = / {
        try_files /home.html /index.html =404;
    }

    location / {
        # Coba file asli -> file dengan ekstensi .html -> direktori -> index fallback
        try_files $uri $uri.html $uri/ /home.html /index.html;
    }

    # --------------------------------------------------------------------------
    # 2. STATIC ASSETS CACHING (Logo, CSS, JS, Images, Icons)
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 3. SUBDIRECTORIES ROUTING (Tech Studio & Digital Subfolders)
    # --------------------------------------------------------------------------
    location /studio/ {
        try_files $uri $uri/ /studio/index.html =404;
    }

    location /digital/ {
        try_files $uri $uri/ /digital/index.html =404;
    }

    location /kopken/ {
        try_files $uri $uri.html $uri/ /kopken/index.html /kopken.html =404;
    }

    # --------------------------------------------------------------------------
    # 4. ERROR PAGES
    # --------------------------------------------------------------------------
    error_page 404 /home.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Block hidden files (e.g. .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
